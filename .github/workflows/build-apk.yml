name: Construire APK Android

on:
  push:
    branches: [ main ]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Vérifier les fichiers JavaScript
        run: |
          node --check app.js
          node --check words.js
          node --check words-debutant.js
          node --check words-moyen.js
          node --check words-confirme.js
          node --check lessons.js
          node --check phrases-extra.js
          node --check activities-extra.js
          node --check content-ultra.js
          node --check corrections-plus.js
          node --check academie.js
          node --check chiffres.js
          node --check vocabulaire.js
          node --check grammaire.js
          node --check grammaire-ux.js
          node --check grammar-data.js
          node --check verb-pronunciation.js
          node --check french-verb-data.js
          node --check adult-data.js
          node --check adult-conversation.js
          node --check adult-training.js
          node --check sw.js

      - name: Vérifier la dépendance Kokoro embarquée
        working-directory: android
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath | tee kokoro-deps.txt

      - name: Construire l APK complet
        working-directory: android
        run: gradle --no-daemon clean assembleDebug

      - name: Vérifier les modules embarqués
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -l "$APK" | grep -E 'model_quantized\.onnx|kokoro.*\.onnx'
          unzip -l "$APK" | grep 'voices/af_heart.bin'
          unzip -l "$APK" | grep 'voices/am_adam.bin'
          unzip -l "$APK" | grep 'voices/bf_emma.bin'
          unzip -l "$APK" | grep 'voices/bm_george.bin'
          unzip -l "$APK" | grep 'assets/classic.html'
          unzip -l "$APK" | grep 'assets/adult.html'
          unzip -l "$APK" | grep 'assets/adult-conversation.html'
          unzip -l "$APK" | grep 'assets/adult-training.html'
          unzip -l "$APK" | grep 'assets/adult-data.js'
          unzip -l "$APK" | grep 'assets/academie.html'
          unzip -l "$APK" | grep 'assets/chiffres.html'
          grep -q 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml || grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          APK_SIZE=$(stat -c%s "$APK")
          echo "Taille APK : $APK_SIZE octets"
          test "$APK_SIZE" -gt 83886080

      - name: Publier l APK complet
        uses: actions/upload-artifact@v4
        with:
          name: Anglais-Plus-v3.7.0-MODE-ADULTE-A2-B1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
