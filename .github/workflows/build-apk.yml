name: Construire APK Android

on:
  push:
    branches: [ main ]
    paths: ['*.html','*.css','*.js','icon.svg','manifest.webmanifest','android/**','.github/workflows/build-apk.yml']
  pull_request:
    branches: [ main ]
    paths: ['*.html','*.css','*.js','icon.svg','manifest.webmanifest','android/**','.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Vérifier JavaScript
        run: |
          for f in app.js words.js words-debutant.js words-moyen.js words-confirme.js lessons.js phrases-extra.js activities-extra.js content-ultra.js corrections-plus.js academie.js chiffres.js vocabulaire.js grammaire.js grammaire-ux.js grammar-data.js verb-pronunciation.js french-verb-data.js adult-data.js adult-conversation.js adult-training.js adult-scenarios-160.js adult-oral.js sw.js; do node --check "$f"; done
          node -e "global.window={};require('./adult-scenarios-160.js');if(window.ADULT_ORAL_SCENARIOS.length!==160)throw new Error('Il faut exactement 160 situations');console.log('Situations orales:',window.ADULT_ORAL_SCENARIOS.length)"
          grep -q 'onNativeTtsFinished' adult-oral.js
          grep -q 'AndroidTTS.preload' adult-oral.js
          ! grep -q 'split(/\\s+/).length\*330' adult-oral.js
      - name: Vérifier Kokoro et faible latence
        working-directory: android
        run: |
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath
          grep -q 'setOnPlaybackCompleteListener' app/src/main/java/com/chasmet/quizanglais/KokoroTtsManager.java
          grep -q 'EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 450L' app/src/main/java/com/chasmet/quizanglais/MainActivity.java
          grep -q 'public boolean preload' app/src/main/java/com/chasmet/quizanglais/MainActivity.java
      - name: Construire APK
        working-directory: android
        run: gradle --no-daemon clean assembleDebug
      - name: Vérifier modules
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -l "$APK" | grep -E 'model_quantized\.onnx|kokoro.*\.onnx'
          for f in adult.html adult-oral.html adult-oral.js adult-scenarios-160.js adult-conversation.html adult-training.html; do unzip -l "$APK" | grep "assets/$f"; done
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          test $(stat -c%s "$APK") -gt 83886080
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Anglais-Plus-v3.8.1-ORAL-FAIBLE-LATENCE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
