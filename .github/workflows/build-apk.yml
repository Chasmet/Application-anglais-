name: Vérifier et construire Anglais+
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anglais-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Compiler et tester Android
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Vérifier les fichiers embarqués
        run: python scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vérifier le démarrage sur Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - name: Conserver l’APK de test séparé
        uses: actions/upload-artifact@v4
        with:
          name: Anglais-Plus-4.0.0-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-android
          path: |
            android/app/build/reports/
            android-smoke-*.xml
            android-smoke.png
            android-smoke.log
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration de signature
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'APK de test compilé. Publication suspendue : configurer les quatre secrets de signature avec la clé de la version actuellement distribuée. Aucun APK incompatible ne remplace la release existante.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
        if: steps.signing.outputs.ready == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
        with: {gradle-version: '8.10.2'}
      - name: Signer avec la clé privée existante
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anglais-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          cd android
          gradle --no-daemon :app:assembleRelease
      - name: Vérifier la compatibilité avant publication
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous-release
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous-release
          python scripts/verify-release.py android/app/build/outputs/apk/release/app-release.apk previous-release
          python scripts/check-apk.py android/app/build/outputs/apk/release/app-release.apk
      - name: Publier une nouvelle version sans remplacer un ancien APK
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import re;print(re.search(r\"versionName '([^']+)'\",open('android/app/build.gradle').read())[1])")
          cp android/app/build/outputs/apk/release/app-release.apk "Anglais-Plus-v${VERSION}.apk"
          sha256sum "Anglais-Plus-v${VERSION}.apk" > "Anglais-Plus-v${VERSION}.apk.sha256"
          gh release create "v${VERSION}" "Anglais-Plus-v${VERSION}.apk" "Anglais-Plus-v${VERSION}.apk.sha256" --target "$GITHUB_SHA" --title "Anglais+ ${VERSION}" --notes-file RELEASE-NOTES.md
