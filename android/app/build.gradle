plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.quizanglais'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chasmet.quizanglais'
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName '3.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources { noCompress 'onnx' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.jokobee:jokobeetts:1.1.0' }

def webRoot = rootProject.projectDir.parentFile
tasks.register('syncWebAssets', Copy) {
    from(webRoot) {
        include 'index.html', 'classic.html', 'adult.html', 'adult-conversation.html', 'adult-training.html', 'adult-oral.html',
                'adult.css', 'adult-oral.css', 'adult-data.js', 'adult-conversation.js', 'adult-training.js', 'adult-scenarios-160.js', 'adult-oral.js',
                'quiz.html', 'style.css', 'app.js',
                'words.js', 'words-debutant.js', 'words-moyen.js', 'words-confirme.js',
                'lessons.js', 'phrases-extra.js', 'activities-extra.js', 'content-ultra.js', 'corrections-plus.js',
                'academie.html', 'academie.js', 'chiffres.html', 'chiffres.js',
                'vocabulaire.html', 'vocabulaire.js',
                'grammaire.html', 'grammaire.js', 'grammaire-ux.js', 'grammaire-ux.css', 'grammar-data.js',
                'verb-pronunciation.js', 'french-verb-data.js', 'learning-tools.css',
                'icon.svg', 'manifest.webmanifest', 'sw.js'
    }
    into "$projectDir/src/main/assets"
}
preBuild.dependsOn syncWebAssets
