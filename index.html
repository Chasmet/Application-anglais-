<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2424" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Quiz Anglais+ 3</title>
  <style>
    :root{--bg:#0b2424;--card:#133131;--border:#36545e;--text:#f6fafa;--muted:#9cb2b7;--green:#8df000;--blue:#3dbbff;--yellow:#ffd54a;--cyan:#22e4e4}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#184747 0%,var(--bg) 52%);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    .launcher{width:100%;max-width:620px;min-height:100vh;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .brand{text-align:center;margin:4vh 0 28px}.brandIcon{width:78px;height:78px;margin:0 auto 16px;display:grid;place-items:center;border-radius:25px;background:#153939;border:3px solid #45656d;font-size:38px;box-shadow:0 7px 0 #213c42}.brand h1{font-size:34px;margin:0 0 8px}.brand p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
    .choices{display:grid;gap:14px}.choice{position:relative;text-decoration:none;color:var(--text);border:3px solid var(--border);border-radius:26px;background:rgba(19,49,49,.96);padding:19px;min-height:128px;display:grid;grid-template-columns:62px 1fr 30px;gap:14px;align-items:center;box-shadow:0 7px 0 #223d43;transition:.15s transform,.15s box-shadow}.choice:active{transform:translateY(4px);box-shadow:0 3px 0 #223d43}.choice .icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:31px;background:#0e2929}.choice strong{display:block;font-size:22px;margin-bottom:5px}.choice small{display:block;color:var(--muted);font-size:14px;line-height:1.35}.choice .arrow{font-size:30px;color:var(--muted);font-weight:900}.choice.quiz{border-color:var(--green)}.choice.quiz .icon{color:var(--green)}.choice.vocab{border-color:var(--blue)}.choice.grammar{border-color:var(--yellow)}
    .footer{margin-top:auto;text-align:center;color:#738f94;font-size:12px;padding-top:24px}
    @media(max-width:390px){.launcher{padding-left:14px;padding-right:14px}.brand{margin-top:2vh}.brand h1{font-size:30px}.choice{min-height:116px;padding:15px;grid-template-columns:54px 1fr 24px}.choice .icon{width:52px;height:52px;font-size:27px}.choice strong{font-size:20px}.choice small{font-size:13px}}
  </style>
</head>
<body>
<main class="launcher">
  <header class="brand">
    <div class="brandIcon">🇬🇧</div>
    <h1>Quiz Anglais+ 3</h1>
    <p>Que veux-tu travailler maintenant ?</p>
  </header>
  <nav class="choices" aria-label="Choisir une section">
    <a class="choice quiz" href="quiz.html"><span class="icon">🎯</span><span><strong>Entraînement</strong><small>Quiz, niveaux, défis, révisions et roadmap.</small></span><span class="arrow">›</span></a>
    <a class="choice vocab" href="vocabulaire.html"><span class="icon">📚</span><span><strong>Vocabulaire</strong><small>Mots anglais, traduction, recherche et écoute.</small></span><span class="arrow">›</span></a>
    <a class="choice grammar" href="grammaire.html"><span class="icon">🔤</span><span><strong>Alphabet & verbes</strong><small>Alphabet, conjugaisons, prononciation et français.</small></span><span class="arrow">›</span></a>
  </nav>
  <div class="footer">Choisis une section pour commencer.</div>
</main>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body>
</html>
